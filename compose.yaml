services:
  api:
    build:
      context: ./express-student-api
    container_name: student-api
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongodb:27017/campusconnect
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - student-network

  mongodb:
    image: mongo:8
    container_name: mongodb
    volumes:
      - student-mongo-data:/data/db
    networks:
      - student-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  student-network:

volumes:
  student-mongo-data:
